name: Vertical scaling CI
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
  schedule: [{cron: '21 4 * * 1'}]
permissions: {contents: read}
concurrency:
  group: scaling-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TOPIC: season-1/2.vertical-vs-horizontal-scaling
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs: {topic: '${{ steps.paths.outputs.topic }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node "$TOPIC/scripts/ci/changes.mjs"
  static:
    needs: changes
    if: needs.changes.outputs.topic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: {version: 11.25.0, run_install: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: season-1/2.vertical-vs-horizontal-scaling/servers/02-express/pnpm-lock.yaml
      - run: node "$TOPIC/scripts/ci/run.mjs" --stage=static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scaling-static-evidence
          retention-days: 7
          path: |
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/ci-static.json
  contract:
    needs: changes
    if: needs.changes.outputs.topic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with: {version: 11.25.0, run_install: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.21.0}
      - run: node "$TOPIC/scripts/ci/run.mjs" --stage=contract
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scaling-contract-evidence
          retention-days: 7
          path: |
            season-1/2.vertical-vs-horizontal-scaling/tests/phase0/artifacts/contract-report-express.json
            season-1/2.vertical-vs-horizontal-scaling/tests/phase0/artifacts/fixture-manifest.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/ci-contract.json
  image:
    needs: changes
    if: needs.changes.outputs.topic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with: {version: 11.25.0, run_install: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.21.0}
      - run: pnpm --pm-on-fail=ignore --dir "$TOPIC/servers/02-express" install --frozen-lockfile
      - run: node "$TOPIC/scripts/ci/run.mjs" --stage=image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scaling-image-stage-evidence
          retention-days: 7
          path: |
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/ci-image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scaling-tested-image
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/ci-image.tar
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/image-identity.json
  security:
    needs: [changes, image]
    if: needs.changes.outputs.topic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.21.0}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scaling-tested-image
          path: season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci
      - run: node "$TOPIC/scripts/ci/run.mjs" --stage=security
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scaling-redacted-security-evidence
          retention-days: 7
          path: |
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/secrets-redacted.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/image-sbom.spdx.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/image-vulnerabilities.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/security-summary.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/sast.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/ci-security.json
  terraform:
    needs: changes
    if: needs.changes.outputs.topic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.21.0}
      - run: node "$TOPIC/scripts/ci/run.mjs" --stage=terraform
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scaling-terraform-evidence
          retention-days: 7
          path: |
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/terraform-verification.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/ci-terraform.json
  operations:
    needs: [changes, image]
    if: needs.changes.outputs.topic == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.21.0}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scaling-tested-image
          path: season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci
      - run: node "$TOPIC/scripts/ci/run.mjs" --stage=operations
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scaling-operations-evidence
          retention-days: 7
          path: |
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/operations-summary.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/recovery-verification.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/rollback-verification.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/mixed-verification.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/ci-operations.json
  required:
    name: Scaling required checks
    needs: [changes, static, contract, image, security, terraform, operations]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - env:
          TOPIC_CHANGED: ${{ needs.changes.outputs.topic }}
          CHECK_RESULTS: '{"static":"${{ needs.static.result }}","contract":"${{ needs.contract.result }}","image":"${{ needs.image.result }}","security":"${{ needs.security.result }}","terraform":"${{ needs.terraform.result }}","operations":"${{ needs.operations.result }}"}'
        run: node "$TOPIC/scripts/ci/changes.mjs" --required
