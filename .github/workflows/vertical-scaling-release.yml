name: Scaling signed release
on:
  workflow_run:
    workflows: [Vertical scaling CI]
    types: [completed]
    branches: [main]
permissions: {contents: read, actions: read}
concurrency:
  group: scaling-release
  cancel-in-progress: false
env:
  TOPIC: season-1/2.vertical-vs-horizontal-scaling
jobs:
  publish:
    if: vars.SCALING_CLOUD_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.workflow_run.head_sha }}', persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 24.21.0}
      - name: Reject stale or substituted trusted source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scaling-tested-image
          path: season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scaling-redacted-security-evidence
          path: season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.SCALING_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: scaling-release
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scaling-operations-evidence
          path: season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scaling-terraform-evidence
          path: season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - name: Publish only the tested and scanned archive
        env:
          CLOUD_TARGET_JSON: ${{ vars.SCALING_CLOUD_TARGET_JSON }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_REF: refs/heads/main
          DOCKER_CONFIG: ${{ runner.temp }}/scaling-registry
        run: node "$TOPIC/scripts/operations/publish.mjs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scaling-signed-release
          retention-days: 30
          if-no-files-found: error
          path: |
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/release.json
            season-1/2.vertical-vs-horizontal-scaling/infra/compose/artifacts/ci/provenance.json
