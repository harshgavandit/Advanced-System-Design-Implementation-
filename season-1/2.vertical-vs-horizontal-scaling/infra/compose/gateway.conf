worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
  map $uri $safe_route {
    default __unmatched__;
    ~*^/health/?$ /health;
    ~*^/ready/?$ /ready;
    ~*^/metrics/?$ /metrics;
    ~*^/products/?$ /products;
    ~*^/products/ingest/?$ /products/ingest;
    ~*^/products/ingest/stats/?$ /products/ingest/stats;
    ~*^/products/[^/]+/?$ /products/:id;
    ~*^/users/signup/?$ /users/signup;
    ~*^/users/login/?$ /users/login;
    ~*^/users/refresh/?$ /users/refresh;
    ~*^/users/me/?$ /users/me;
    ~*^/users/logout/?$ /users/logout;
    ~*^/cart/?$ /cart;
    ~*^/cart/[^/]+/quantity/?$ /cart/:id/quantity;
    ~*^/cart/[^/]+/?$ /cart/:id;
    ~*^/wishlist/?$ /wishlist;
    ~*^/wishlist/[^/]+/?$ /wishlist/:id;
    ~*^/ingestion-jobs/[^/]+/redrive/?$ /ingestion-jobs/:id/redrive;
    ~*^/ingestion-jobs/[^/]+/?$ /ingestion-jobs/:id;
  }
  log_format edge escape=json '{"kind":"edge","service":"catalog-edge","method":"$request_method","route":"$safe_route","status":$status,"duration":$request_time,"requestId":"$request_id","traceId":"$upstream_http_x_trace_id","upstream":"$upstream_addr","upstreamStatus":"$upstream_status","upstreamConnectSeconds":"$upstream_connect_time"}';
  access_log /dev/stdout edge;
  include /etc/nginx/edge-logging.conf;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api_backend {
    zone api_backend 64k;
    server api:5002 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
  }
  server {
    listen 8080;
    client_max_body_size 32k;
    proxy_cache off;
    # All peers are on the same local Docker bridge. Bound stale-address
    # connection attempts so a dead peer cannot occupy a multi-second budget.
    proxy_connect_timeout 250ms;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    location ~* ^/(metrics|api-docs)(/|$) { return 404; }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_next_upstream error timeout http_502 http_503;
      # Allow the complete four-replica pool after a stale connection/address.
      # Nginx still does not replay non-idempotent POST/PATCH after sending.
      proxy_next_upstream_tries 4;
      proxy_next_upstream_timeout 4s;
      # Localhost-only lab evidence, not a production response header.
      add_header X-Lab-Upstream $upstream_addr always;
      proxy_pass http://api_backend;
    }
  }
}
